[project]
name = "cleanup-qwen35-planner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers>=5.12,<6",
  "accelerate>=1.6,<2",
  "Pillow>=10,<13",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
