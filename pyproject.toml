[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanup-robot"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
description = "Local SmolVLA manipulation, multilingual routing and monitored retries"
dependencies = [
  "lerobot[smolvla,libero]",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "Pillow>=10,<13",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.5",
  "huggingface-hub>=0.34.2,<0.36",
  "sentence-transformers>=3,<4",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchcodec==0.4.0",
  "cmake==3.31.6",
  "opencv-python==4.12.0.88",
]

[project.scripts]
cleanup-robot = "cleanup_robot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.13.4"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", tag = "v0.4.4" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake==3.31.6", "setuptools>=71,<81", "wheel"]

hf-egl-probe = ["cmake==3.31.6", "setuptools>=71,<81", "wheel"]
